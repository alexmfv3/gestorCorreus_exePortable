  m.innerHTML = accBar() + `
    <h1>Remitents</h1>
    <p class="sub">Qui t'envia més correus. Elimina o mou tots els correus d'un remitent (o d'un domini sencer, com infojobs.net) d'un sol cop.</p>
    <div class="card toolbar">
      <div class="fbtn">${ic("users", 24)}</div>
      <select class="sel" id="sf" style="min-width:220px;max-width:280px">${treeOptions(curFolder(), {root: false, selectableOnly: true})}</select>
      <div class="seg" id="sg"><button data-g="email">Per adreça</button><button data-g="domain">Per domini</button></div>
      <div class="search" style="max-width:340px">${ic("search", 20)}<input id="sq" placeholder="Filtra remitents…" value="${esc(S.sq)}"></div>
      <select class="sel" id="smin"><option value="1">Tots</option><option value="2">2 o més</option><option value="5">5 o més</option><option value="10">10 o més</option><option value="20">20 o més</option><option value="50">50 o més</option></select>
      <span class="spacer"></span>
      <button class="btn" id="refresh">${ic("refresh", 20)} Actualitza</button>
    </div>
    <div class="selrow" id="ssel"></div>
    <div class="card list" id="slist"><div class="empty">Carregant…</div></div>`;
  bindAccBar();
  $("#sf").value = curFolder(); $("#smin").value = S.smin;
  $$("#sg button").forEach(b => { b.classList.toggle("on", b.dataset.g === S.sgroup); b.onclick = () => { S.sgroup = b.dataset.g; S.ssel.clear(); $$("#sg button").forEach(x => x.classList.toggle("on", x === b)); renderSenders(); }; });
  $("#sf").onchange = async e => { S.folder[a.id] = e.target.value; S.ssel.clear(); S.sel.clear(); render(); };
  let t; $("#sq").oninput = e => { clearTimeout(t); t = setTimeout(() => { S.sq = e.target.value; renderSenders(); }, 120); };
  $("#smin").onchange = e => { S.smin = +e.target.value; renderSenders(); };
  $("#refresh").onclick = async () => { try { await loadMessages(curFolder(), true); await refreshFolders(); S.ssel.clear(); render(); } catch (e) { toast(e.message, 1); } };
  try { await loadMessages(); } catch (e) { $("#slist").innerHTML = `<div class="empty"><h3>No s'han pogut llegir els correus</h3><p>${esc(e.message)}</p></div>`; return; }
  if (S.page === "remitents") renderSenders();
}

function renderSenders() {
  const c = S.cache[ckey()]; if (!c || !$("#slist")) return;
  let gs = groupSenders(c);
  const q = S.sq.trim().toLowerCase();
  gs = gs.filter(g => g.uids.length >= S.smin && (!q || (g.key + " " + g.name).toLowerCase().includes(q)));
  const max = gs[0]?.uids.length || 1;
  const selG = gs.filter(g => S.ssel.has(g.key));
  const selN = selG.reduce((s, g) => s + g.uids.length, 0);
  $("#ssel").innerHTML = `<label class="chk"><input type="checkbox" id="sall" ${gs.length && selG.length === gs.length ? "checked" : ""}> Selecciona tots</label>
    <span class="muted">${fmtN(gs.length)} ${S.sgroup === "domain" ? "dominis" : "remitents"} · ${fmtN(gs.reduce((s, g) => s + g.uids.length, 0))} correus</span>
    ${selG.length ? `<span class="spacer"></span><button class="btn sm" id="smove">${ic("move", 17)} Mou ${fmtN(selN)} correus</button><button class="btn sm danger" id="sdel">${ic("trash", 17)} Elimina ${fmtN(selN)} correus de ${selG.length} ${S.sgroup === "domain" ? "dominis" : "remitents"}</button>` : ""}`;
  $("#sall").indeterminate = selG.length > 0 && selG.length < gs.length;
  $("#sall").onchange = e => { gs.forEach(g => e.target.checked ? S.ssel.add(g.key) : S.ssel.delete(g.key)); renderSenders(); };
  const allU = () => selG.flatMap(g => g.uids);
  $("#sdel") && ($("#sdel").onclick = async () => { await doDelete(allU(), curFolder(), ` de ${selG.length} ${S.sgroup === "domain" ? "dominis" : "remitents"}`); S.ssel.clear(); });
  $("#smove") && ($("#smove").onclick = async () => { await doMove(allU()); S.ssel.clear(); });

  const L = $("#slist");
  if (!gs.length) { L.innerHTML = `<div class="empty">${ic("users", 56, 1.3)}<h3>Cap remitent</h3><p>${c.messages.length ? "Canvia el filtre o el mínim de correus." : "Aquesta carpeta és buida."}</p></div>`; return; }
  const shown = gs.slice(0, 400);
  L.innerHTML = shown.map((g, i) => `<div class="srow ${S.ssel.has(g.key) ? "sel" : ""}" data-i="${i}">
      <label class="chk"><input type="checkbox" ${S.ssel.has(g.key) ? "checked" : ""}></label>
      ${avatar(g.key, (S.sgroup === "domain" ? g.key : g.name)[0])}
      <div style="min-width:0"><div class="t1">${esc(S.sgroup === "domain" ? g.key : g.name)}</div>
        <div class="t3">${S.sgroup === "domain" ? `${g.emails.size} adreç${g.emails.size > 1 ? "es" : "a"} · ${esc([...g.emails].slice(0, 2).join(", "))}${g.emails.size > 2 ? "…" : ""}` : esc(g.key)}</div></div>
      <div><div class="bar"><i style="width:${Math.max(3, g.uids.length / max * 100)}%"></i></div>
        <div class="bar-l">${fmtSize(g.size)} · darrer ${fmtDate(g.last)}${g.unread ? ` · ${fmtN(g.unread)} no llegits` : ""}</div></div>
      <div class="count">${fmtN(g.uids.length)}</div>
      <div class="acts"><button class="btn sm" data-a="view" title="Veure els correus">${ic("eye", 17)}</button>
        <button class="btn sm" data-a="move">${ic("move", 17)} Mou</button>
        <button class="btn sm danger" data-a="del">${ic("trash", 17)} Elimina ${fmtN(g.uids.length)}</button></div>
    </div>`).join("") + (gs.length > 400 ? `<div class="more muted">Es mostren els 400 primers. Fes servir el filtre per trobar-ne d'altres.</div>` : "");
  L.onclick = e => {
    const row = e.target.closest(".srow"); if (!row) return;
    const g = shown[+row.dataset.i], a = e.target.closest("[data-a]")?.dataset.a;
    if (a === "del") return doDelete(g.uids, curFolder(), ` de ${S.sgroup === "domain" ? "@" + g.key : g.name}`).then(() => S.ssel.delete(g.key));
    if (a === "move") return doMove(g.uids);
    if (a === "view") { S.senderFilter = {kind: S.sgroup === "domain" ? "domain" : "email", value: g.key}; S.q = ""; S.tab = "all"; S.sel.clear(); return go("correus"); }
    if (e.target.closest("button") || e.target.tagName === "LABEL") return;
    S.ssel.has(g.key) ? S.ssel.delete(g.key) : S.ssel.add(g.key);
    renderSenders();
  };
}

/* ============================================================ CARPETES */
async function newFolderDialog(parent = "") {
  const r = await promptBox({title: parent ? "Nova subcarpeta" : "Nova carpeta", label: "Nom", ok: "Crea",
    extra: `<div class="fld"><label>Dins de</label><select id="par">${treeOptions(parent)}</select></div>`});
  if (!r || !r.value.trim()) return;
  parent = $("#par", r.ov)?.value || "";
  try { const x = await acall("folder_create", {id: S.cur, name: r.value, parent}); S.folders[S.cur] = x.folders;
    if (parent) openPathTo(x.name); toast(`Carpeta «${r.value.trim()}» creada`); }
  catch (e) { toast(e.message, 1); }
  render();
}

async function pageCarpetes(m) {
  if (!await connectGate(m, "Carpetes", "")) return;
  const fl = S.folders[S.cur];
  const tot = fl.reduce((s, f) => s + (f.messages || 0), 0);
  m.innerHTML = accBar() + `
    <h1>Carpetes</h1>
    <p class="sub">Les carpetes del servidor amb les seves subcarpetes. Crea'n, reanomena-les o elimina-les; els canvis es fan al servidor.</p>
    <div class="card toolbar"><div class="fbtn">${ic("folder", 24)}</div>
      <b style="font-size:17px">${fl.filter(f => f.selectable).length} carpetes · ${fmtN(tot)} correus</b>
      <div class="search" style="max-width:320px;min-width:220px">${ic("search", 20)}<input id="mq" placeholder="Cerca una carpeta…" value="${esc(S.mq)}"></div>
      <span class="spacer"></span>
      <button class="btn sm" id="expall">Desplega-ho tot</button><button class="btn sm" id="colall">Plega-ho tot</button>
      <button class="btn" id="refresh">${ic("refresh", 20)} Actualitza</button>
      <button class="btn pri" id="nf">${ic("plus", 20)} Nova carpeta</button></div>
    <div class="card list"><div class="mhead"><span>CARPETA</span><span class="r">CORREUS</span><span class="r">NO LLEGITS</span><span class="r">MIDA</span><span></span></div>
      <div id="mtree"></div></div>`;
  bindAccBar();
  const {root, map} = buildTree();
  let rows = [];
  const draw = () => {
    rows = flatTree(root, S.mq);
    const el = $("#mtree");
    if (!rows.length) { el.innerHTML = `<div class="empty">Cap carpeta coincideix.</div>`; return; }
    el.innerHTML = rows.map(({n, depth, open}, i) => {
      const f = n.folder, kids = n.children.length, closed = kids && !open;
      const leaf = f ? n.label : n.label;
      const acts = !f ? "" : `
        ${f.selectable ? `<button class="ib" data-a="open" title="Obre els correus">${ic("eye", 18)}</button>` : `<span class="ib ghost"></span>`}
        ${f.flags.some(x => /noinferiors/i.test(x)) ? `<span class="ib ghost"></span>` : `<button class="ib" data-a="sub" title="Crea una subcarpeta">${ic("sub", 18)}</button>`}
        ${f.special !== "inbox" ? `<button class="ib" data-a="ren" title="Reanomena">${ic("edit", 18)}</button>` : `<span class="ib ghost"></span>`}
        ${(f.special === "trash" || f.special === "spam") && f.messages ? `<button class="ib red" data-a="empty" title="Buida (esborra tots els correus)">${ic("refresh", 18)}</button>` : `<span class="ib ghost"></span>`}
        ${f.special !== "inbox" ? `<button class="ib red" data-a="del" title="Elimina la carpeta">${ic("trash", 18)}</button>` : `<span class="ib ghost"></span>`}`;
      return `<div class="mrow" data-i="${i}">
        <div class="nm" style="padding-left:${depth * 26}px">
          ${kids ? `<button class="tw ${open ? "open" : ""}" data-tw>${ic("chev", 15, 2.2)}</button>` : `<span class="tsp"></span>`}
          ${f ? fIcon(f) : ic("folder", 20)}
          <div style="min-width:0"><b>${esc(leaf)}</b>${kids ? ` <span style="color:var(--faint);font-size:12.5px">· ${kids} subcarpet${kids > 1 ? "es" : "a"}</span>` : ""}
            ${f && f.special ? ` <span class="pill nodot vio" style="font-size:11.5px;padding:2px 9px;margin-left:4px">${SPECIAL_TXT[f.special] || f.special}</span>` : ""}
            ${S.mq ? `<div class="path">${esc(f ? f.name : "")}</div>` : ""}</div></div>
        <span class="r strong">${f && f.selectable ? fmtN(closed ? n.tot : f.messages) : closed ? fmtN(n.tot) : "—"}</span>
        <span class="r">${f && f.selectable ? fmtN(closed ? n.totU : f.unseen) : "—"}</span>
        <span class="r">${f && f.size != null ? fmtSize(f.size) : "—"}</span>
        <div class="macts">${acts}</div></div>`;
    }).join("");
  };
  draw();
  $("#mq").oninput = e => { S.mq = e.target.value; draw(); };
  $("#expall").onclick = () => { map.forEach(n => n.children.length && OPEN.add(n.key)); saveOpen(); draw(); };
  $("#colall").onclick = () => { map.forEach(n => OPEN.delete(n.key)); saveOpen(); draw(); };
  $("#nf").onclick = () => newFolderDialog();
  $("#refresh").onclick = async () => { await refreshFolders(); render(); };
  $("#mtree").onclick = async e => {
    const row = e.target.closest(".mrow"); if (!row) return;
    const {n} = rows[+row.dataset.i], f = n.folder;
    if (e.target.closest("[data-tw]")) { OPEN.has(n.key) ? OPEN.delete(n.key) : OPEN.add(n.key); saveOpen(); return draw(); }
    const a = e.target.closest("[data-a]")?.dataset.a;
    if (!a) { if (n.children.length) { OPEN.has(n.key) ? OPEN.delete(n.key) : OPEN.add(n.key); saveOpen(); draw(); } return; }
    if (a === "open") { S.folder[S.cur] = f.name; S.sel.clear(); S.senderFilter = null; openPathTo(f.name); return go("correus"); }
    if (a === "sub") { OPEN.add(n.key); saveOpen(); return newFolderDialog(f.name); }
    if (a === "ren") {
      const leaf = f.delim ? f.name.split(f.delim).pop() : f.name;
      const r = await promptBox({title: "Reanomena la carpeta", label: "Nom nou", value: leaf, ok: "Reanomena",
        lead: f.special ? "És una carpeta especial del servidor; reanomenar-la pot fer que el teu programa de correu no la reconegui." : (n.children.length ? "Les subcarpetes es mouran amb ella." : "")});
      if (!r || !r.value.trim() || r.value.trim() === leaf) return;
      try { const x = await acall("folder_rename", {id: S.cur, old: f.name, new: r.value});
        const oldK = n.key; S.folders[S.cur] = x.folders;
        const newK = treeNodeOf(x.name);
        if (newK) [...OPEN].filter(k => k === oldK || k.startsWith(oldK + "\u0001")).forEach(k => { OPEN.delete(k); OPEN.add(newK + k.slice(oldK.length)); });
        saveOpen();
        Object.keys(S.cache).filter(k => k.startsWith(S.cur + "|" + f.name)).forEach(k => delete S.cache[k]);
        if (curFolder() === f.name) S.folder[S.cur] = x.name;
        else if (curFolder().startsWith(f.name + (f.delim || "/"))) S.folder[S.cur] = x.name + curFolder().slice(f.name.length);
        toast("Carpeta reanomenada"); }
      catch (err) { toast(err.message, 1); }
      return render();
    }
    if (a === "del") {
      const subs = [...n.children]; let subN = 0; const cnt = c => { subN++; c.children.forEach(cnt); }; subs.forEach(cnt);
      const ok = await confirmBox({title: `Eliminar «${esc(n.label)}»?`, danger: true, ok: "Elimina la carpeta",
        body: `S'eliminarà la carpeta del servidor${f.messages ? ` <b>amb els seus ${fmtN(f.messages)} correus</b>` : ""}. No es pot desfer.
          ${subN ? `<div class="note warn" style="margin-top:14px">Té ${subN} subcarpet${subN > 1 ? "es" : "a"}. Molts servidors no deixen eliminar una carpeta que en té: elimina-les primer.</div>` : ""}
          ${f.special ? `<div class="note warn" style="margin-top:14px">És una carpeta especial (${SPECIAL_TXT[f.special]}).</div>` : ""}`});
      if (!ok) return;
      try { const x = await acall("folder_delete", {id: S.cur, name: f.name}); S.folders[S.cur] = x.folders; delete S.cache[ckey(f.name)]; toast("Carpeta eliminada"); }
      catch (err) { toast(err.message, 1); }
      return render();
    }
    if (a === "empty") {
      const ok = await confirmBox({title: `Buidar «${esc(n.label)}»?`, danger: true, ok: "Buida",
        body: `S'esborraran definitivament els <b>${fmtN(f.messages)}</b> correus d'aquesta carpeta.`});
      if (!ok) return;
      try { const r = await runJob("folder_empty", {id: S.cur, name: f.name}, "Buidant la carpeta"); delete S.cache[ckey(f.name)]; toast(`${nC(r.count)} esborrats`); }
      catch (err) { toast(err.message, 1); }
      await refreshFolders(); render();
    }
  };
}

/* ============================================================ INFORMACIÓ */
async function pageInfo(m) {
  if (!await connectGate(m, "Informació", "")) return;
  const a = acc();
  m.innerHTML = accBar() + `<h1>Informació</h1><p class="sub">Espai del compte i dades del servidor.</p><div class="card empty">Consultant el servidor…</div>`;
  bindAccBar();
  let info;
  try { info = await acall("info", {id: a.id}); S.folders[a.id] = info.folders; }
  catch (e) { m.querySelector(".empty").innerHTML = `<h3>No s'ha pogut obtenir la informació</h3><p>${esc(e.message)}</p>`; return; }
  if (S.page !== "informacio" || S.cur !== a.id) return;
  const qd = info.quota, fl = info.folders.filter(f => f.selectable);
  const msgs = fl.reduce((s, f) => s + (f.messages || 0), 0);
  const knownSize = fl.some(f => f.size != null) ? fl.reduce((s, f) => s + (f.size || 0), 0) : null;
  // mides calculades dels correus ja carregats
  const loaded = {}; for (const f of fl) { const c = S.cache[ckey(f.name)]; if (c) loaded[f.name] = c.messages.reduce((s, x) => s + x.size, 0); }
  let quotaHtml;
  if (qd.supported && !qd.unlimited && qd.limit) {
    const pct = Math.min(100, qd.used / qd.limit * 100);
    quotaHtml = `<div class="big-n">${fmtSize(qd.limit - qd.used)} <span style="font-size:18px;color:var(--muted);font-weight:600">lliures</span></div>
      <div class="qbar"><i class="${pct > 90 ? "crit" : pct > 75 ? "warn" : ""}" style="width:${Math.max(1.5, pct)}%"></i></div>
      <div style="display:flex;justify-content:space-between;color:var(--muted)"><span>${fmtSize(qd.used)} usats (${pct.toFixed(1).replace(".", ",")} %)</span><span>de ${fmtSize(qd.limit)}</span></div>
      ${pct > 90 ? `<div class="note err" style="margin-top:16px">El compte és gairebé ple. Elimina correus grans o buida la paperera.</div>` : ""}`;
  } else if (qd.supported && qd.unlimited) {
    quotaHtml = `<div class="big-n" style="display:flex;align-items:center;gap:12px">${ic("infinity", 44, 2)} Il·limitat</div>
      <p style="color:var(--muted);margin:10px 0 0">El servidor indica que aquest compte no té límit d'espai.${qd.used != null ? ` Ara ocupa <b>${fmtSize(qd.used)}</b>.` : ""}</p>`;
  } else {
    quotaHtml = `<div class="big-n" style="display:flex;align-items:center;gap:12px">${ic("infinity", 44, 2)} Sense límit informat</div>
      <p style="color:var(--muted);margin:10px 0 0">El servidor no publica cap quota per IMAP. Normalment vol dir que el compte té espai il·limitat o que el límit només es pot consultar al panell del proveïdor.</p>`;
  }
  if (qd.messages_limit) quotaHtml += `<p style="color:var(--muted)">Missatges: ${fmtN(qd.messages_used)} de ${fmtN(qd.messages_limit)}</p>`;
  const sec = {ssl: "SSL/TLS", starttls: "STARTTLS", none: "Sense xifrar"};
  m.innerHTML = accBar() + `<h1>Informació</h1><p class="sub">Espai del compte i dades del servidor.</p>
    <div class="cards2">
      <div class="card" style="padding:30px 34px"><div style="display:flex;align-items:center;gap:14px;margin-bottom:8px"><div class="fbtn">${ic("disk", 24)}</div><b style="font-size:20px">Espai del compte</b></div>${quotaHtml}</div>
      <div class="card" style="padding:30px 34px"><div style="display:flex;align-items:center;gap:14px;margin-bottom:18px"><div class="fbtn">${ic("mail", 24)}</div><b style="font-size:20px">Resum</b></div>
        <div style="display:flex;gap:40px;flex-wrap:wrap"><div><div class="big-n">${fmtN(msgs)}</div><span style="color:var(--muted)">correus en total</span></div>
        <div><div class="big-n">${fl.length}</div><span style="color:var(--muted)">carpetes</span></div>
        <div><div class="big-n">${fmtN(fl.reduce((s, f) => s + (f.unseen || 0), 0))}</div><span style="color:var(--muted)">no llegits</span></div>
        ${knownSize != null ? `<div><div class="big-n">${fmtSize(knownSize)}</div><span style="color:var(--muted)">ocupats</span></div>` : ""}</div></div>
    </div>
    <div class="cards2">
      <div class="card" style="padding:30px 34px"><b style="font-size:20px;display:block;margin-bottom:18px">Compte i servidor</b>
        <div class="kv"><span>Nom</span><b>${esc(a.label)}</b><span>Correu</span><div>${esc(a.email)}</div><span>Usuari</span><div>${esc(a.username)}</div>
          <span>Tipus</span><div>${PROV[a.type] ? accKind(a) : "Servidor propi (Roundcube)"}</div>
          <span>IMAP</span><div>${esc(a.imap_host)}:${a.imap_port} · ${sec[a.imap_security]}</div>
          <span>SMTP</span><div>${a.smtp_host ? `${esc(a.smtp_host)}:${a.smtp_port} · ${sec[a.smtp_security]}` : "—"}</div>
          <span>Paperera</span><div>${esc(info.trash || "No trobada")}</div>
          <span>En eliminar</span><div>${a.delete_mode === "permanent" ? "Esborrar definitivament" : "Moure a la paperera"}</div>
          <span>Contrasenya</span><div>${a.has_password ? "Desada en aquest ordinador" : "Es demana en obrir el compte"}</div></div></div>
      <div class="card" style="padding:30px 34px"><b style="font-size:20px;display:block;margin-bottom:18px">Capacitats del servidor</b>
        <div class="caps">${info.capabilities.map(c => `<i>${esc(c)}</i>`).join("")}</div>
        <p style="color:var(--muted);font-size:13.5px;margin-top:16px">${info.capabilities.includes("MOVE") ? "✓ Mou correus de manera nativa (MOVE)." : "Mou correus copiant i esborrant (el servidor no té MOVE)."}<br>
        ${info.capabilities.includes("QUOTA") ? "✓ Informa de la quota d'espai." : "No informa de la quota d'espai."}</p></div>
    </div>
    <div class="card list"><table class="t"><thead><tr><th>CARPETA</th><th class="r">CORREUS</th><th class="r">NO LLEGITS</th><th class="r">MIDA</th></tr></thead><tbody>
      ${fl.map(f => `<tr><td><span style="display:inline-flex;gap:10px;align-items:center;color:var(--accent)">${fIcon(f)}<span style="color:var(--ink)">${esc(fname(f))}</span></span></td>
        <td class="r">${fmtN(f.messages)}</td><td class="r">${fmtN(f.unseen)}</td>
        <td class="r" style="color:var(--muted)">${f.size != null ? fmtSize(f.size) : loaded[f.name] != null ? fmtSize(loaded[f.name]) : "—"}</td></tr>`).join("")}
    </tbody></table></div>
    ${knownSize == null ? `<p style="color:var(--faint);font-size:13px;margin-top:12px">La mida per carpeta apareix quan l'has obert a «Correus» (el servidor no la dona directament).</p>` : ""}`;
  bindAccBar();
}

/* ============================================================ COMPTES */
async function pageComptes(m) {
  m.innerHTML = accBar() + `<h1>Comptes</h1><p class="sub">Afegeix, edita o elimina els teus comptes de correu.</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(380px,1fr))">${S.accounts.map(a => `<div class="card fcard">
      <div class="top"><div class="fi" style="font-weight:800;font-size:20px">${accMark(a, 26)}</div>
        <div style="min-width:0;flex:1"><h3>${esc(a.label)}</h3><div class="path">${esc(a.email)}</div></div>
        <span class="pill ${a.connected ? "" : "grey"}">${a.connected ? "Connectat" : "Desconnectat"}</span></div>
      <div class="kv" style="grid-template-columns:110px 1fr;font-size:14px"><span>Servidor</span><div>${esc(a.imap_host)}:${a.imap_port}</div>
        <span>Contrasenya</span><div>${a.has_password ? "Desada" : "Es demana cada cop"}</div></div>
      <div class="bt"><button class="btn sm" data-a="open" data-id="${a.id}">${ic("eye", 17)} Obre</button>
        <button class="btn sm" data-a="edit" data-id="${a.id}">${ic("edit", 17)} Edita</button>
        ${a.connected ? `<button class="btn sm" data-a="disc" data-id="${a.id}">${ic("plug", 17)} Desconnecta</button>` : ""}
        <button class="btn sm danger" data-a="del" data-id="${a.id}">${ic("trash", 17)} Elimina</button></div></div>`).join("")}
      <button class="card fcard" id="addc" style="border:2px dashed var(--accent-line);align-items:center;justify-content:center;cursor:pointer;color:var(--accent);font-weight:700;font-size:17px;min-height:200px;background:#fbfaff">${ic("plus", 34)} Afegeix compte</button>
    </div>`;
  bindAccBar();
  $("#addc").onclick = () => accountForm();
  $$("[data-a]").forEach(b => b.onclick = async () => {
    const a = S.accounts.find(x => x.id === b.dataset.id);
    if (b.dataset.a === "open") { S.cur = a.id; localStorage.setItem("gc.cur", a.id); go("correus"); }
    if (b.dataset.a === "edit") accountForm(a);
    if (b.dataset.a === "disc") { await call("disconnect", {id: a.id}); delete S.folders[a.id]; Object.keys(S.cache).filter(k => k.startsWith(a.id + "|")).forEach(k => delete S.cache[k]); await loadState(); render(); }
    if (b.dataset.a === "del") {
      const ok = await confirmBox({title: `Treure «${esc(a.label)}»?`, danger: true, ok: "Treu el compte",
        body: "Només s'esborra la configuració d'aquest programa. Els correus del servidor no es toquen."});
      if (!ok) return;
      await call("account_delete", {id: a.id}); delete S.folders[a.id]; await loadState(); render();
    }
  });
}

function accountForm(existing) {
  const e = existing || {type: "roundcube", imap_port: 993, imap_security: "ssl", smtp_port: 465, smtp_security: "ssl", save_password: true, delete_mode: "trash"};
  let type = e.type;
  const ov = modal(`<h2>${existing ? "Edita el compte" : "Afegeix un compte"}</h2><p class="lead">${existing ? "Modifica les dades del compte." : "Tria el tipus de compte i escriu les dades del servidor."}</p>
    <div class="types">
      <button class="type" data-t="roundcube"><div class="ti">${ic("server", 24)}</div><div><b>Servidor propi</b><span>Roundcube · IMAP/SMTP</span></div></button>
      <button class="type" data-t="gmail"><div class="ti">G</div><div><b>Gmail</b><span>Compte de Google</span></div></button>
      <button class="type" data-t="yahoo"><div class="ti" style="font-size:17px">Y!</div><div><b>Yahoo</b><span>Yahoo Mail</span></div></button>
    </div>
    <div class="note" id="gnote">A <span id="gname">Gmail</span> necessites una <b>contrasenya d'aplicació</b>, no la contrasenya normal. <a href="#" id="hl">Com s'obté?</a></div>
    <div class="g2"><div class="fld"><label>Adreça de correu</label><input id="f_email" type="email" value="${esc(e.email || "")}" placeholder="nom@domini.cat"></div>
      <div class="fld"><label>Nom del compte</label><input id="f_label" value="${esc(e.label || "")}" placeholder="Feina, Personal…"></div></div>
    <div class="g2"><div class="fld" id="w_user"><label>Usuari</label><input id="f_user" value="${esc(e.username || "")}" placeholder="Normalment, l'adreça de correu"></div>
      <div class="fld"><label id="pwl">Contrasenya</label><input id="f_pw" type="password" autocomplete="new-password" placeholder="${existing && existing.has_password ? "•••••••• (desada; deixa-la en blanc per mantenir-la)" : ""}"></div></div>
    <label class="chk" style="margin:2px 0 4px"><input type="checkbox" id="f_save" ${e.save_password ? "checked" : ""}> Desa la contrasenya en aquest ordinador</label>
    <div style="color:var(--muted);font-size:13px;margin:0 0 6px 34px" id="savehint"></div>
    <div id="srv">
      <div class="sect">SERVIDOR D'ENTRADA (IMAP)</div>
      <div class="g3"><div class="fld"><label>Servidor</label><input id="f_ih" value="${esc(e.imap_host || "")}" placeholder="mail.domini.cat"></div>
        <div class="fld"><label>Port</label><input id="f_ip" type="number" value="${e.imap_port || 993}"></div>
        <div class="fld"><label>Seguretat</label><select id="f_is"><option value="ssl">SSL/TLS</option><option value="starttls">STARTTLS</option><option value="none">Cap</option></select></div></div>
      <div class="sect">SERVIDOR DE SORTIDA (SMTP) · opcional</div>
      <div class="g3"><div class="fld"><label>Servidor</label><input id="f_sh" value="${esc(e.smtp_host || "")}" placeholder="smtp.domini.cat"></div>
        <div class="fld"><label>Port</label><input id="f_sp" type="number" value="${e.smtp_port || 465}"></div>
        <div class="fld"><label>Seguretat</label><select id="f_ss"><option value="ssl">SSL/TLS</option><option value="starttls">STARTTLS</option><option value="none">Cap</option></select></div></div>
    </div>
    <div class="fld" style="margin-top:6px"><label>Quan eliminis correus</label><select id="f_dm"><option value="trash">Mou-los a la paperera (recuperables)</option><option value="permanent">Esborra'ls definitivament</option></select></div>
    <div class="note" id="res" style="display:none"></div>
    <div class="foot"><button class="btn" data-x>Cancel·la</button><button class="btn" id="test">${ic("plug", 18)} Prova la connexió</button><button class="btn pri" id="save">${ic("check", 18)} Desa</button></div>`, "wide");
  ov.close = () => ov.remove();
  $("#f_is", ov).value = e.imap_security || "ssl"; $("#f_ss", ov).value = e.smtp_security || "ssl"; $("#f_dm", ov).value = e.delete_mode || "trash";
  const upd = () => {
    $$(".type", ov).forEach(b => b.classList.toggle("on", b.dataset.t === type));
    const pv = PROV[type];
    $("#srv", ov).style.display = pv ? "none" : "";
    $("#w_user", ov).style.display = pv ? "none" : "";
    $("#gnote", ov).style.display = pv ? "" : "none";
    if (pv) $("#gname", ov).textContent = pv.name;
    $("#pwl", ov).textContent = pv ? "Contrasenya d'aplicació" : "Contrasenya";
    $("#savehint", ov).textContent = $("#f_save", ov).checked ? "Es guarda xifrada amb el teu usuari de Windows." : "Te la demanarà cada vegada que obris aquest compte.";
  };
  upd();
  $$(".type", ov).forEach(b => b.onclick = () => { type = b.dataset.t; upd(); });
  $("#f_save", ov).onchange = upd;
  $("#hl", ov).onclick = ev => { ev.preventDefault(); ov.remove(); go("ajuda"); };
  $("#f_email", ov).oninput = ev => {
    const v = ev.target.value, d = v.split("@")[1];
    for (const [k, pv] of Object.entries(PROV)) if (pv.re.test(v) && type !== k) { type = k; upd(); }
    if (d && !PROV[type]) {
      if (!$("#f_ih", ov).dataset.touched) $("#f_ih", ov).value = "mail." + d;
      if (!$("#f_sh", ov).dataset.touched) $("#f_sh", ov).value = "mail." + d;
    }
  };
  ["#f_ih", "#f_sh"].forEach(s => $(s, ov).addEventListener("input", ev => ev.target.dataset.touched = 1));
  if (existing) { $("#f_ih", ov).dataset.touched = 1; $("#f_sh", ov).dataset.touched = 1; }
  $("#f_is", ov).onchange = ev => { $("#f_ip", ov).value = ev.target.value === "ssl" ? 993 : 143; };
  $("#f_ss", ov).onchange = ev => { $("#f_sp", ov).value = ev.target.value === "ssl" ? 465 : 587; };
  const data = () => ({id: existing?.id, type, email: $("#f_email", ov).value.trim(), label: $("#f_label", ov).value.trim(),
    username: PROV[type] ? $("#f_email", ov).value.trim() : $("#f_user", ov).value.trim(),
    imap_host: $("#f_ih", ov).value.trim(), imap_port: +$("#f_ip", ov).value, imap_security: $("#f_is", ov).value,
    smtp_host: $("#f_sh", ov).value.trim(), smtp_port: +$("#f_sp", ov).value, smtp_security: $("#f_ss", ov).value,
    save_password: $("#f_save", ov).checked, delete_mode: $("#f_dm", ov).value});
  const res = (cls, html) => { const r = $("#res", ov); r.className = "note " + cls; r.style.display = "block"; r.innerHTML = html; };
  $("[data-x]", ov).onclick = () => ov.remove();
  $("#test", ov).onclick = async () => {
    const b = $("#test", ov); b.disabled = true; res("", "Provant la connexió…");
    try {
      const r = await call("account_test", {account: data(), password: $("#f_pw", ov).value});
      res("ok", `✓ Connexió IMAP correcta. S'han trobat <b>${r.folders}</b> carpetes.` + (r.smtp ? (r.smtp === "ok" ? "<br>✓ SMTP correcte." : `<br>⚠ ${esc(r.smtp)}`) : ""));
    } catch (er) { res("err", esc(er.message)); }
    b.disabled = false;
  };
  $("#save", ov).onclick = async () => {
    const d = data();
    if (!d.email) return res("err", "Escriu l'adreça de correu.");
    if (!PROV[type] && !d.imap_host) return res("err", "Escriu el servidor IMAP.");
    const pw = $("#f_pw", ov).value;
    const b = $("#save", ov); b.disabled = true;
    try {
      const r = await call("account_save", {account: d, password: pw || null});
      if (existing) { delete S.folders[r.account.id]; Object.keys(S.cache).filter(k => k.startsWith(r.account.id + "|")).forEach(k => delete S.cache[k]); }
      S.cur = r.account.id; localStorage.setItem("gc.cur", S.cur);
      await loadState(); ov.remove();
      toast(existing ? "Compte desat" : "Compte afegit");
      S.page = existing ? S.page : "correus"; render();
    } catch (er) { res("err", esc(er.message)); b.disabled = false; }
  };
  setTimeout(() => $("#f_email", ov).focus(), 30);
}

/* ============================================================ AJUDA */
function pageAjuda(m) {
  m.innerHTML = (S.accounts.length ? accBar() : "") + `<div class="help"><h1>Com connectar-lo</h1><p class="sub">Què necessites per afegir cada tipus de compte.</p>
    <div class="card"><h3 style="margin-top:0">Gmail</h3>
      <p>Google no deixa entrar per IMAP amb la contrasenya normal. Cal crear una <b>contrasenya d'aplicació</b>:</p>
      <ol><li>Activa la <b>verificació en dos passos</b> al teu compte de Google (Seguretat).</li>
        <li>Obre <code>myaccount.google.com/apppasswords</code>, escriu un nom (p. ex. «Gestor de Correus») i prem <b>Crea</b>.</li>
        <li>Copia les 16 lletres que surten i enganxa-les com a contrasenya aquí (els espais no importen).</li></ol>
      <p style="color:var(--muted)">El servidor ja s'omple sol: <code>imap.gmail.com</code> port 993 SSL. A Gmail, eliminar mou els correus a la Paperera i Google els esborra al cap de 30 dies; pots buidar-la a «Carpetes».</p></div>
    <div class="card"><h3 style="margin-top:0">Yahoo</h3>
      <p>Yahoo tampoc deixa entrar per IMAP amb la contrasenya normal. Cal una <b>contrasenya d'aplicació</b>:</p>
      <ol><li>Entra a Yahoo i obre <b>Informació del compte → Seguretat del compte</b>.</li>
        <li>Prem <b>Genera una contrasenya d'aplicació</b> (o «Generate app password»), escriu un nom (p. ex. «Gestor de Correus») i prem <b>Genera</b>.</li>
        <li>Copia la contrasenya que surt i enganxa-la aquí (els espais no importen).</li></ol>
      <p style="color:var(--muted)">El servidor ja s'omple sol: <code>imap.mail.yahoo.com</code> port 993 SSL. Funciona amb adreces <code>@yahoo.com</code>, <code>@yahoo.es</code>, <code>@ymail.com</code> i <code>@rocketmail.com</code>. A Yahoo la carpeta de correu brossa es diu «Bulk» i surt amb la icona d'avís.</p></div>
    <div class="card"><h3 style="margin-top:0">Servidor propi (Roundcube)</h3>
      <p>Roundcube és la web del correu; per dins fa servir IMAP i SMTP. Les dades te les dona el teu proveïdor d'allotjament (sovint a l'apartat «Configurar client de correu»):</p>
      <ol><li><b>Servidor IMAP</b>: sovint <code>mail.eldomini.cat</code>, port <b>993</b> amb SSL/TLS (o 143 amb STARTTLS).</li>
        <li><b>Servidor SMTP</b> (opcional, per a futures funcions): port <b>465</b> SSL/TLS o <b>587</b> STARTTLS.</li>
        <li><b>Usuari</b>: normalment l'adreça de correu completa. <b>Contrasenya</b>: la mateixa que fas servir a Roundcube.</li></ol>
      <p style="color:var(--muted)">Prem «Prova la connexió» abans de desar per comprovar que tot és correcte.</p></div>
    <div class="card"><h3 style="margin-top:0">Contrasenyes</h3>
      <p>Si marques «Desa la contrasenya», es guarda xifrada amb el teu usuari de Windows (només el teu usuari en aquest ordinador la pot llegir). Si no, el programa te la demana cada vegada que obres el compte i només la recorda mentre està obert.</p>
      ${S.configPath ? `<p style="color:var(--muted)">Configuració: <code>${esc(S.configPath)}</code></p>` : ""}</div></div>`;
  if (S.accounts.length) bindAccBar();
}

/* ---------------------------------------------------------------- init */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") return closeTop();
  if ((e.key === "Delete") && S.page === "correus" && S.sel.size && !$(".ov") && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) doDelete([...S.sel]);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f" && (S.page === "correus" || S.page === "remitents")) { e.preventDefault(); ($("#q") || $("#sq"))?.focus(); }
});
setInterval(() => fetch("/api/ping", {method: "POST", headers: {"X-Token": TOKEN}, body: "{}"}).catch(() => {}), 30000);
(async () => { await loadState(); render(); })();
</script>
</body>
</html>
