name: Compila l'exe portable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·la dependències
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: Proves del motor (IMAP simulat + DPAPI)
        run: python tests/test_backend.py

      - name: Crea GestorCorreus.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name GestorCorreus
          --icon assets/icon.ico
          --add-data "ui;ui"
          app.py

      - name: Comprova que l'exe arrenca
        shell: pwsh
        run: |
          $env:GESTOR_NO_UI = "1"
          $env:GESTOR_PORT = "8765"
          $p = Start-Process -FilePath "dist\GestorCorreus.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200 -and $r.Content -match "Gestor de Correus") { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "L'exe no ha arrencat"; exit 1 }
          Write-Host "L'exe arrenca i serveix la interfície."

      - uses: actions/upload-artifact@v4
        with:
          name: GestorCorreus
          path: dist/GestorCorreus.exe

      - name: Publica a Releases (última versió)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-versio --yes --cleanup-tag || true
          gh release create ultima-versio dist/GestorCorreus.exe \
            --title "Gestor de Correus (última versió)" \
            --notes "Executable portable per a Windows 10/11. No cal instal·lar Python. Compilat des de ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
